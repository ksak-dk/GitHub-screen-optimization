<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub Screen Optimization</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="wrap">
      <h1 class="title">GitHub Screen Optimization</h1>
      <label class="row">
        <input id="enabled" type="checkbox" />
        <span id="enabledLabel">启用 GitHub 优化</span>
      </label>

      <div class="row" style="margin-top:10px;">
        <span id="langLabel" style="min-width:56px;">语言</span>
        <select id="lang" aria-label="Language" style="flex:1;">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="ko">한국어</option>
        </select>
      </div>

      <p class="hint" id="hint">对仓库页 Summary、Release 资产筛选、返回顶部按钮生效。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
